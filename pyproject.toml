[project]
name = "agent-ecs-helper"
version = "0.1.0"
description = "LangGraph agent for managing Volcengine ECS through the official ECS MCP server."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "langgraph-cli[inmem]>=0.4.0",
    "langgraph-sdk>=0.3.0",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=0.3.0",
    "langgraph>=0.6.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
ecs-agent = "agent_ecs_helper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ecs_helper"]
